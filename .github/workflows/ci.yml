name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema
      - run: python3 -m pytest tests/ -q
      - name: Validate structured context
        run: |
          for f in context/structured/*.json; do python3 src/pipeline.py validate "$f"; done
